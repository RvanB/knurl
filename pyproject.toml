[project]
name = "neural-highlight"
version = "0.1.0"
description = "Byte-level syntax highlighting experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0,<5",
    "torch>=2.7,<3",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-c>=0.24,<0.25",
    "tree-sitter-cpp>=0.23,<0.24",
    "tree-sitter-css>=0.25,<0.26",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-html>=0.23,<0.24",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-rust>=0.24,<0.25",
    "tree-sitter-typescript>=0.23,<0.24",
    "wandb>=0.25,<0.26",
    "tree-sitter-bash>=0.25,<0.26",
    "tree-sitter-sql>=0.3,<0.4",
    "tree-sitter-markdown>=0.5,<0.6",
    "tree-sitter-lua>=0.4,<0.5",
    "tree-sitter-ruby>=0.23,<0.24",
    "tree-sitter-glsl>=0.2,<0.3",
    "onnx>=1.18,<2",
    "onnxruntime-gpu>=1.23,<2",
]

[project.scripts]
neural-highlight-annotate = "neural_highlight.dataset.annotate:main"
neural-highlight-prepare = "neural_highlight.dataset.prepare:main"
neural-highlight-fragments = "neural_highlight.dataset.fragments:main"
neural-highlight-serve = "neural_highlight.stream_server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
