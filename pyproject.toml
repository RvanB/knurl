[project]
name = "neural-highlight"
version = "0.1.0"
description = "Byte-level syntax highlighting experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0,<5",
    "torch>=2.7,<3",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "wandb>=0.25,<0.26",
]

[project.scripts]
neural-highlight-annotate = "neural_highlight.dataset.annotate:main"
neural-highlight-prepare = "neural_highlight.dataset.prepare:main"
neural-highlight-fragments = "neural_highlight.dataset.fragments:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
